<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash & Falguni — Wedding Logo Monogram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Italiana&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0F0F26;
      color: #D4A84B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 2rem;
    }
    .card {
      background: radial-gradient(circle at center, #1B1B3A 0%, #0F0F26 100%);
      border: 1px solid rgba(212, 168, 75, 0.25);
      border-radius: 24px;
      padding: 3rem 4rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 168, 75, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .logo-container {
      width: 260px;
      height: 276px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 4px 15px rgba(212, 168, 75, 0.25));
    }
    h1 {
      font-family: 'Italiana', serif;
      font-size: 1.25rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 1rem;
      color: #D4A84B;
    }
    p.date {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-top: 0.5rem;
      color: #E4D4A8;
    }
    .instructions {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: rgba(245, 230, 201, 0.6);
      max-width: 400px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
        <!-- Wreath Sprigs -->
        <g fill="#D4A84B" stroke="#D4A84B">
          <g transform="translate(255, 170) rotate(90)"><line x1="-6" y1="0" x2="6" y2="0" stroke-width="0.45" opacity="0.85"/><ellipse cx="-4.5" cy="-1.9" rx="1.6" ry="2.2" opacity="0.92"/><ellipse cx="-4.5" cy="1.9" rx="1.6" ry="2.2" opacity="0.92"/><ellipse cx="0" cy="-2.4" rx="1.7" ry="2.5" opacity="0.95"/><ellipse cx="0" cy="2.4" rx="1.7" ry="2.5" opacity="0.95"/><ellipse cx="4.5" cy="-1.7" rx="1.4" ry="2" opacity="0.88"/><ellipse cx="4.5" cy="1.7" rx="1.4" ry="2" opacity="0.88"/></g>
          <g transform="translate(250.36, 199.36) rotate(108)"><circle cx="0" cy="0" r="3" opacity="0.95"/><path d="M -5 2 C -7 3 -8 2 -6 1 Z" opacity="0.7"/></g>
          <g transform="translate(236.95, 225.88) rotate(126)"><path d="M -6 -2.5 C -2 -4 3 -3 6 -0.5 C 3 0.5 -2 -0.5 -6 -2.5 Z" opacity="0.9"/><path d="M -6 0 C -2 -1 4 -1 7 0 C 4 1 -2 1 -6 0 Z" opacity="0.92"/><path d="M -6 2.5 C -2 4 3 3 6 0.5 C 3 -0.5 -2 0.5 -6 2.5 Z" opacity="0.9"/><circle cx="-6.5" cy="0" r="0.9" opacity="0.85"/></g>
          <g transform="translate(215.88, 247.95) rotate(144)"><circle cx="0" cy="0" r="3.2" opacity="0.92"/><path d="M -4 -1.8 C -6 -3 -7.5 -1.8 -5.2 -0.8 Z" opacity="0.8"/><path d="M -4 1.8 C -6 3 -7.5 1.8 -5.2 0.8 Z" opacity="0.8"/></g>
          <g transform="translate(104.12, 247.95) rotate(216)"><circle cx="0" cy="0" r="3.2" opacity="0.92"/><path d="M -4 -1.8 C -6 -3 -7.5 -1.8 -5.2 -0.8 Z" opacity="0.8"/><path d="M -4 1.8 C -6 3 -7.5 1.8 -5.2 0.8 Z" opacity="0.8"/></g>
          <g transform="translate(83.05, 225.88) rotate(234)"><path d="M -6 -2.5 C -2 -4 3 -3 6 -0.5 C 3 0.5 -2 -0.5 -6 -2.5 Z" opacity="0.9"/><path d="M -6 0 C -2 -1 4 -1 7 0 C 4 1 -2 1 -6 0 Z" opacity="0.92"/><path d="M -6 2.5 C -2 4 3 3 6 0.5 C 3 -0.5 -2 0.5 -6 2.5 Z" opacity="0.9"/><circle cx="-6.5" cy="0" r="0.9" opacity="0.85"/></g>
          <g transform="translate(69.64, 199.36) rotate(252)"><circle cx="0" cy="0" r="3" opacity="0.95"/><path d="M -5 2 C -7 3 -8 2 -6 1 Z" opacity="0.7"/></g>
          <g transform="translate(65, 170) rotate(270)"><line x1="-6" y1="0" x2="6" y2="0" stroke-width="0.45" opacity="0.85"/><ellipse cx="-4.5" cy="-1.9" rx="1.6" ry="2.2" opacity="0.92"/><ellipse cx="-4.5" cy="1.9" rx="1.6" ry="2.2" opacity="0.92"/><ellipse cx="0" cy="-2.4" rx="1.7" ry="2.5" opacity="0.95"/><ellipse cx="0" cy="2.4" rx="1.7" ry="2.5" opacity="0.95"/><ellipse cx="4.5" cy="-1.7" rx="1.4" ry="2" opacity="0.88"/><ellipse cx="4.5" cy="1.7" rx="1.4" ry="2" opacity="0.88"/></g>
          <g transform="translate(69.64, 140.64) rotate(288)"><circle cx="0" cy="0" r="3" opacity="0.95"/><path d="M -5 2 C -7 3 -8 2 -6 1 Z" opacity="0.7"/></g>
          <g transform="translate(83.05, 114.12) rotate(306)"><path d="M -6 -2.5 C -2 -4 3 -3 6 -0.5 C 3 0.5 -2 -0.5 -6 -2.5 Z" opacity="0.9"/><path d="M -6 0 C -2 -1 4 -1 7 0 C 4 1 -2 1 -6 0 Z" opacity="0.92"/><path d="M -6 2.5 C -2 4 3 3 6 0.5 C 3 -0.5 -2 0.5 -6 2.5 Z" opacity="0.9"/><circle cx="-6.5" cy="0" r="0.9" opacity="0.85"/></g>
          <g transform="translate(104.12, 92.05) rotate(324)"><circle cx="0" cy="0" r="3.2" opacity="0.92"/><path d="M -4 -1.8 C -6 -3 -7.5 -1.8 -5.2 -0.8 Z" opacity="0.8"/><path d="M -4 1.8 C -6 3 -7.5 1.8 -5.2 0.8 Z" opacity="0.8"/></g>
          <g transform="translate(215.88, 92.05) rotate(36)"><circle cx="0" cy="0" r="3.2" opacity="0.92"/><path d="M -4 -1.8 C -6 -3 -7.5 -1.8 -5.2 -0.8 Z" opacity="0.8"/><path d="M -4 1.8 C -6 3 -7.5 1.8 -5.2 0.8 Z" opacity="0.8"/></g>
          <g transform="translate(236.95, 114.12) rotate(54)"><path d="M -6 -2.5 C -2 -4 3 -3 6 -0.5 C 3 0.5 -2 -0.5 -6 -2.5 Z" opacity="0.9"/><path d="M -6 0 C -2 -1 4 -1 7 0 C 4 1 -2 1 -6 0 Z" opacity="0.92"/><path d="M -6 2.5 C -2 4 3 3 6 0.5 C 3 -0.5 -2 0.5 -6 2.5 Z" opacity="0.9"/><circle cx="-6.5" cy="0" r="0.9" opacity="0.85"/></g>
          <g transform="translate(250.36, 140.64) rotate(72)"><circle cx="0" cy="0" r="3" opacity="0.95"/><path d="M -5 2 C -7 3 -8 2 -6 1 Z" opacity="0.7"/></g>
        </g>

        <!-- Crown -->
        <g transform="translate(160, 58)" fill="#D4A84B">
          <rect x="-11" y="0" width="22" height="3" rx="0.6" />
          <path d="M -11 0 L -9 -7 L -5 -3 L 0 -10 L 5 -3 L 9 -7 L 11 0 Z" />
          <circle cx="-9" cy="-8" r="1.2" />
          <circle cx="0" cy="-11" r="1.5" />
          <circle cx="9" cy="-8" r="1.2" />
          <path d="M 0 -16 C -2.4 -19 -5 -17.5 -3 -14.5 C -1.5 -13 0 -12 0 -12 C 0 -12 1.5 -13 3 -14.5 C 5 -17.5 2.4 -19 0 -16 Z" opacity="0.9"/>
        </g>

        <!-- Monogram Cipher -->
        <text x="140" y="206" text-anchor="middle" fill="#D4A84B" style="font-family: 'Pinyon Script', cursive; font-size: 94px; font-weight: 400; letter-spacing: -0.05em;">AF</text>

        <!-- Heart & Ribbon -->
        <g transform="translate(160, 278)" fill="#D4A84B" stroke="#D4A84B">
          <path d="M 0 3 C -6 -3 -11 -1 -8 4 C -5 8 -1 10 0 12 C 1 10 5 8 8 4 C 11 -1 6 -3 0 3 Z" />
          <path d="M -7 12 C -12 14 -17 15 -22 13 L -20 13.5 L -22 13 L -20 12" stroke-width="1" fill="none" stroke-linecap="round" />
          <path d="M 7 12 C 12 14 17 15 22 13 L 20 13.5 L 22 13 L 20 12" stroke-width="1" fill="none" stroke-linecap="round" />
        </g>

        <!-- Names Divider -->
        <line x1="80" y1="305" x2="240" y2="305" stroke="#D4A84B" stroke-width="0.4" opacity="0.35" />
        <text x="160" y="318" text-anchor="middle" fill="#D4A84B" style="font-family: 'Italiana', serif; font-size: 11.5px; letter-spacing: 4.5px; text-transform: uppercase;">· AKASH &amp; FALGUNI ·</text>

        <!-- Date -->
        <text x="160" y="333" text-anchor="middle" fill="#D4A84B" opacity="0.78" style="font-family: 'Inter', sans-serif; font-size: 7.5px; letter-spacing: 3.2px; text-transform: uppercase;">23rd January 2027</text>
      </svg>
    </div>
    <h1>Akash &amp; Falguni</h1>
    <p class="date">23rd January 2027</p>
  </div>

</body>
</html>
